---
- name: Generer le rapport final
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Creer le repertoire du rapport
      ansible.builtin.file:
        path: reports
        state: directory
        mode: '0755'

    - name: Generer le rapport Markdown
      ansible.builtin.template:
        src: templates/rapport_etat.md.j2
        dest: reports/rapport_etat.md
        mode: '0644'
